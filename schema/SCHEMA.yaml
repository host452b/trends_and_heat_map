dataset:
  name: Global Career Development Index
  version: "1.0"
  description_zh: 全球职业发展指数数据集，覆盖34个评分维度、趋势与复合指数
  description_en: Global Career Development Index dataset covering 34 scoring dimensions, trends, and composite index

columns:
  id:
    index: 1
    type: string
    description_zh: 唯一记录标识符，格式 {iso_code}_{sub_category_en}
    description_en: Unique record identifier, format {iso_code}_{sub_category_en}
    pattern: "^[A-Z]{2}(_[A-Z]{2})?_[a-z0-9_]+$"

  major_category:
    index: 2
    type: string
    description_zh: 大类职业名称（中文）
    description_en: Major occupational category name (Chinese)

  major_code:
    index: 3
    type: string
    description_zh: 大类代码
    description_en: Major category code
    enum: [TECH, MED, FIN, EDU, ENG, GOV, LAW, ART, TRA, SKL, SVC, AGR]

  mid_category:
    index: 4
    type: string
    description_zh: 中类职业名称（中文）
    description_en: Mid-level occupational category name (Chinese)

  sub_category:
    index: 5
    type: string
    description_zh: 细分职业名称（中文）
    description_en: Sub-category occupational name (Chinese)

  sub_category_en:
    index: 6
    type: string
    description_zh: 细分职业名称（英文，用于ID生成）
    description_en: Sub-category occupational name (English, used for ID generation)

  isco_code:
    index: 7
    type: string
    description_zh: 国际标准职业分类代码（ISCO-08）
    description_en: International Standard Classification of Occupations code (ISCO-08)
    nullable: true

  onet_code:
    index: 8
    type: string
    description_zh: O*NET职业代码（美国劳工部）
    description_en: O*NET occupation code (US Department of Labor)
    nullable: true

  region:
    index: 9
    type: string
    description_zh: 地区名称（中文）
    description_en: Region name (Chinese)

  country_or_region:
    index: 10
    type: string
    description_zh: 国家或地区名称（中文）
    description_en: Country or region name (Chinese)

  iso_code:
    index: 11
    type: string
    description_zh: ISO 3166-1 alpha-2 国家代码
    description_en: ISO 3166-1 alpha-2 country code
    pattern: "^[A-Z]{2}$"

  type:
    index: 12
    type: string
    description_zh: 记录类型：country=国家，region=地区
    description_en: "Record type: country=country, region=region"
    enum: [country, region]

  employer_type:
    index: 13
    type: string
    description_zh: 雇主类型
    description_en: Employer type
    enum: [general, state_monopoly, state_owned, private_large, private_sme, startup, freelance]

  typical_education:
    index: 14
    type: string
    description_zh: 典型入职学历要求
    description_en: Typical educational requirement for entry

  typical_entry_age:
    index: 15
    type: string
    description_zh: 典型入职年龄范围
    description_en: Typical entry age range

  locality:
    index: 16
    type: string
    description_zh: 地域适用范围标签
    description_en: Geographic applicability tag
    enum: [global, regional, country_specific]

  learning_cost:
    index: 17
    type: float
    range: [0, 10]
    weight: 3
    category: 入门门槛
    description_zh: 入门学习成本（时间+金钱）
    description_en: Entry learning cost (time + money)
    reverse: true
    source: "O*NET Education/Training"

  education_req:
    index: 18
    type: float
    range: [0, 10]
    weight: 3
    category: 入门门槛
    description_zh: 学历要求门槛
    description_en: Educational requirement threshold
    reverse: true

  growth_coeff:
    index: 19
    type: float
    range: [0, 10]
    weight: 4
    category: 发展空间
    description_zh: 职业发展系数（晋升通道、成长空间）
    description_en: Career growth coefficient (promotion channels, growth potential)

  career_lifespan:
    index: 20
    type: float
    range: [0, 10]
    weight: 3
    category: 发展空间
    description_zh: 职业生命周期长度
    description_en: Career lifespan length

  opportunity:
    index: 21
    type: float
    range: [0, 10]
    weight: 3
    category: 发展空间
    description_zh: 机会丰富度（横向发展、转岗机会）
    description_en: Opportunity richness (lateral development, transfer opportunities)

  market_size:
    index: 22
    type: float
    range: [0, 10]
    weight: 2
    category: 市场面
    description_zh: 市场规模（从业人数、岗位总量）
    description_en: Market size (number of practitioners, total positions)

  supply_demand:
    index: 23
    type: float
    range: [0, 10]
    weight: 4
    category: 市场面
    description_zh: 供需比（需求/供给）
    description_en: Supply-demand ratio (demand/supply)

  developed_scarcity:
    index: 24
    type: float
    range: [0, 10]
    weight: 4
    category: 市场面
    description_zh: 发达地区稀缺度
    description_en: Scarcity in developed regions

  value_added:
    index: 25
    type: float
    range: [0, 10]
    weight: 5
    category: 收入与回报
    description_zh: 价值附加度（薪资水平相对GDP）
    description_en: Value added (salary level relative to GDP)

  cost_performance:
    index: 26
    type: float
    range: [0, 10]
    weight: 4
    category: 收入与回报
    description_zh: 投入产出比（性价比）
    description_en: Cost-performance ratio (return on investment)

  stability:
    index: 27
    type: float
    range: [0, 10]
    weight: 4
    category: 稳定与风险
    description_zh: 就业稳定性（裁员风险、行业周期）
    description_en: Employment stability (layoff risk, industry cycles)

  safety:
    index: 28
    type: float
    range: [0, 10]
    weight: 3
    category: 稳定与风险
    description_zh: 人身安全度
    description_en: Personal safety level

  occupational_disease:
    index: 29
    type: float
    range: [0, 10]
    weight: 2
    category: 稳定与风险
    description_zh: 职业病风险（越低越好，已取反）
    description_en: Occupational disease risk (lower is better, already inverted)

  overtime:
    index: 30
    type: float
    range: [0, 10]
    weight: 3
    category: 稳定与风险
    description_zh: 加班程度（越低越好）
    description_en: Overtime level (lower is better)

  burnout:
    index: 31
    type: float
    range: [0, 10]
    weight: 3
    category: 稳定与风险
    description_zh: 职业倦怠风险
    description_en: Burnout risk level

  skill_versatility:
    index: 32
    type: float
    range: [0, 10]
    weight: 3
    category: 口碑与转型
    description_zh: 技能通用性（跨行业迁移能力）
    description_en: Skill versatility (cross-industry transferability)

  career_switch:
    index: 33
    type: float
    range: [0, 10]
    weight: 3
    category: 口碑与转型
    description_zh: 转行难易度（越易越高分）
    description_en: Career switching ease (higher = easier)

  reputation_variance:
    index: 34
    type: float
    range: [0, 5]
    weight: 3
    category: 口碑与转型
    description_zh: 口碑方差（社会评价波动，0=极稳，5=极不稳）
    description_en: Reputation variance (social evaluation fluctuation, 0=very stable, 5=very unstable)
    special_normalization: reverse_0_5

  ai_resistance:
    index: 35
    type: float
    range: [0, 10]
    weight: 6
    category: 未来
    description_zh: AI替代抗性（越高越不易被AI替代）
    description_en: AI replacement resistance (higher = less likely to be replaced by AI)

  social_status:
    index: 36
    type: float
    range: [0, 10]
    weight: 3
    category: 生活质量
    description_zh: 社会地位与认可度
    description_en: Social status and recognition

  remote_friendly:
    index: 37
    type: float
    range: [0, 10]
    weight: 3
    category: 生活质量
    description_zh: 远程工作友好度
    description_en: Remote work friendliness

  autonomy:
    index: 38
    type: float
    range: [0, 10]
    weight: 3
    category: 生活质量
    description_zh: 工作自主度
    description_en: Work autonomy level

  family_friendly:
    index: 39
    type: float
    range: [0, 10]
    weight: 3
    category: 生活质量
    description_zh: 家庭友好度（工时规律、假期）
    description_en: Family friendliness (regular hours, vacation)

  fulfillment:
    index: 40
    type: float
    range: [0, 10]
    weight: 3
    category: 生活质量
    description_zh: 职业成就感与意义感
    description_en: Professional fulfillment and sense of meaning

  entrepreneurship:
    index: 41
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 创业友好度
    description_en: Entrepreneurship friendliness

  gender_equality:
    index: 42
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 性别平等度
    description_en: Gender equality level

  age_flexibility:
    index: 43
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 年龄包容度（入行/退出灵活性）
    description_en: Age flexibility (entry/exit flexibility)

  social_interaction:
    index: 44
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 社会交互度（适合社交型人格）
    description_en: Social interaction level (suitable for social personality types)

  physical_demand:
    index: 45
    type: float
    range: [0, 10]
    weight: 1
    category: 结构性与灵活性
    description_zh: 体力需求度（越高越累，已取反）
    description_en: Physical demand level (higher = more physically demanding, inverted)
    reverse: true

  license_barrier:
    index: 46
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 执照/资质壁垒（越高越难入行，已取反）
    description_en: License/qualification barrier (higher = harder entry, inverted)
    reverse: true

  cycle_sensitivity:
    index: 47
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 经济周期敏感度（越高越受经济波动影响，已取反）
    description_en: Economic cycle sensitivity (higher = more affected by economic cycles, inverted)
    reverse: true

  side_job_compat:
    index: 48
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 兼职/副业兼容性
    description_en: Side job / freelance compatibility

  intl_mobility:
    index: 49
    type: float
    range: [0, 10]
    weight: 3
    category: 结构性与灵活性
    description_zh: 国际流动性（跨国就业便利度）
    description_en: International mobility (cross-border employment convenience)

  industry_monopoly:
    index: 50
    type: float
    range: [0, 10]
    weight: 2
    category: 结构性与灵活性
    description_zh: 行业垄断度（越高越受垄断制约，已取反）
    description_en: Industry monopoly level (higher = more monopoly constraints, inverted)
    reverse: true

  trend_2000_2026:
    index: 51
    type: integer
    range: [-5, 5]
    description_zh: 2000-2026年长期趋势评分（-5极衰退，+5极增长）
    description_en: Long-term trend score 2000-2026 (-5 extreme decline, +5 extreme growth)

  trend_5yr:
    index: 52
    type: integer
    range: [-5, 5]
    description_zh: 近5年趋势评分（-5极衰退，+5极增长）
    description_en: 5-year trend score (-5 extreme decline, +5 extreme growth)

  demand_direction:
    index: 53
    type: string
    description_zh: 需求方向箭头指示
    description_en: Demand direction arrow indicator
    enum: ["↑↑", "↑", "→", "↓", "↓↓"]

  ai_timeline:
    index: 54
    type: string
    description_zh: AI对该职业影响的预估时间线（如"2030年前中等影响"）
    description_en: Estimated AI impact timeline for this occupation (e.g., "moderate impact before 2030")

  composite_index:
    index: 55
    type: float
    range: [0, 10]
    description_zh: 综合指数（加权得分，满分10分）
    description_en: Composite index (weighted score, max 10 points)

  summary_zh:
    index: 56
    type: string
    description_zh: 职业简评（中文，100字以内）
    description_en: Occupation brief summary (Chinese, within 100 characters)

  summary_en:
    index: 57
    type: string
    description_zh: 职业简评（英文，100词以内）
    description_en: Occupation brief summary (English, within 100 words)

  data_source:
    index: 58
    type: string
    description_zh: 数据来源说明
    description_en: Data source description
